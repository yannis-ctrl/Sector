steps:
  - uses: actions/checkout@v4

  - name: Install dependencies
    run: |
      sudo apt-get update
      pip install --upgrade pip
      pip install buildozer cython==0.29.37
      sudo apt-get install -y \
        python3-dev \
        openjdk-17-jdk \
        libsdl2-dev \
        libsdl2-image-dev \
        libsdl2-mixer-dev \
        libsdl2-ttf-dev \
        libportmidi-dev \
        libswscale-dev \
        libavformat-dev \
        libavcodec-dev \
        zlib1g-dev

  - name: Create buildozer.spec
    run: |
      cat > buildozer.spec << 'EOF'
      [app]
      title = SECTOR
      package.name = sector
      package.domain = com.sector
      source.dir = .
      source.include_exts = py,png,jpg,kv,atlas
      version = 1.0
      requirements = python3,kivy
      orientation = portrait
      android.permissions = INTERNET
      android.api = 33
      android.minapi = 21

      [buildozer]
      log_level = 2
      EOF

  - name: Show files
    run: |
      pwd
      find .

  - name: Build APK
    run: buildozer -v android debug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: sector-apk
      path: bin/*.apk
